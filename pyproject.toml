[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "akrismohan-rgb", email = "akrismohan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "langchain>=1.3.17",
    "langchain-google-genai>=4.0.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-tavily",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.8.0",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
